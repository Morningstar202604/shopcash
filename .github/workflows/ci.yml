name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # prepare 钩子会编译 packages/shared 产出 ESM，供前端与开发接口复用
      - name: 安装依赖
        run: npm ci --include=dev

      - name: 类型检查
        run: npm run lint

      - name: Vue 模板绑定自检（tsc 不覆盖 .vue）
        run: npm run check:vue

      - name: 内核单测（含覆盖率门槛 90%）
        run: npm test -- --coverage

      - name: Mock 安全与界面回归
        run: |
          npm run test:mock-security
          npm run test:regression

      - name: 前端构建
        run: npm run build

      - name: 安装界面自检所需浏览器
        run: npx playwright install --with-deps chromium

      - name: 隔离入口回归测试
        run: npm run test:isolation

      - name: 端到端自检（隔离服务）
        run: |
          npm run test:api
          SHOTS_DIR="$RUNNER_TEMP/shots" npm run test:ui

      - name: 归档界面截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
